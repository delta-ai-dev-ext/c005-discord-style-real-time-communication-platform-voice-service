relationships:
- id: r-client-token
  source: client
  target: svc
  type: request
  interaction:
    channel: direct
    purpose: token issuance
    protocol: HTTP
    exchange_id: token-issuance
  evidence:
  - path: docs/architecture.md
    quote: Client calls `POST /v1/voice/channels/{channel_id}/token` with a Clerk
      JWT.
  - path: docs/architecture.md
    quote: Join Voice Room Flow (Synchronous HTTP)
- id: r-client-participants
  source: client
  target: svc
  type: request
  interaction:
    channel: direct
    purpose: participant listing
