  - path: docs/user_stories.md
    quote: '`GET /v1/voice/channels/{channel_id}/participants` is called with a valid
      Clerk JWT.'
  - path: docs/architecture.md
    quote: Join Voice Room Flow (Synchronous HTTP)
- id: r-community
  source: svc
  target: community
  type: request
  interaction:
    channel: direct
    purpose: channel access check
    protocol: REST
    exchange_id: access-check
  evidence:
  - path: docs/architecture.md
    quote: '`voice_service` calls `community_service` `GET /internal/v1/channels/{channel_id}/access/{user_id}`
      to check access.'
  - path: docs/architecture.md
    quote: Outbound REST client to `community_service`
- id: r-livekit
  source: svc
  target: livekit
  type: request
  interaction:
    channel: direct
    purpose: room moderation
    exchange_id: room-moderation
  evidence:
  - path: docs/architecture.md
    quote: '`voice_service` calls LiveKit''s `RoomServiceClient` to remove the participant
      from all of the community''s voice rooms listed in the event payload (`voice_channel_ids`).'
- id: r-webhook
  source: livekit_webhook
  target: svc
  type: event
  interaction:
    channel: callback
    purpose: session metrics
    protocol: webhook
  evidence:
  - path: docs/openapi_spec.yaml
    quote: Receives events from LiveKit Cloud (`participant_joined`, `participant_left`,
      `room_finished`).
  - path: docs/adr-001.md
    quote: via a signed webhook (JWT + body SHA-256)
- id: r-cons
  source: events
  target: svc
  type: event
  interaction:
    channel: messaging
    purpose: moderation enforcement
    protocol: Kafka
  messaging:
    role: consumer
    topic: community_events
  evidence:
  - path: docs/architecture.md
    quote: '`voice_service` (consumer group `voice_service`) consumes these events.'
  - path: docs/architecture.md
    quote: to the `community_events` Kafka topic.
